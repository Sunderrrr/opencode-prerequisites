# Versions pinned and VERIFIED on 2026-11-04 (real build + test on the oc-android API 36 image).
# Re-check before bumping: `oc-versions --refresh android`, then rebuild + tests.
#
# What `oc-versions android` reported that day:
#   AGP 9.5.0 · Kotlin 2.4.21 · Compose BOM 2026.09.00 · activity-compose 1.13.0
# Choices:
#   - agp and activity-compose: latest versions, as is;
#   - kotlin: 2.2.10 = Kotlin version embedded in AGP 9.5.0 (kotlin-gradle-plugin
#     dependency of the AGP POM). The Compose Compiler plugin must stay aligned
#     with it; do not move it to 2.4.21 without moving AGP to a version that
#     embeds that Kotlin;
#   - composeBom: 2026.06.01, the maximum accepted with compileSdk 36. A newer BOM
#     (2026.09.00) fails checkDebugAarMetadata ("requires compile against
#     version 37 or later"); an oc-android API 37 image is then required.
[versions]
agp = "9.5.0"
kotlin = "2.2.10"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
junit = "4.13.2"

[libraries]
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
