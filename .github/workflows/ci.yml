name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Valider le kit (config, agents, skills, plugins, secrets)
        run: node scripts/validate-kit.mjs
      - name: Plugins locaux (test fonctionnel avec un faux contexte OpenCode v2)
        run: node scripts/test-plugins.mjs
      - name: oc-models (choix des modèles par agent, survie aux mises à jour)
        run: node scripts/test-models.mjs
      - name: Config conforme au schéma JSON officiel d'OpenCode (complet + léger)
        run: |
          pip install --quiet jsonschema
          python3 scripts/validate-schema.py
      - name: "Installateur côté machine : bloc d'environnement, désinstallation, MemPalace, diagnostic OpenCode périmé"
        run: node scripts/test-install-env.mjs
      - name: "Module Android (faux podman : commandes, montages, protections, faux adb)"
        run: node scripts/test-android.mjs
      - name: "Outils pentest/appsec (option --pentest : découverte GitHub, sha256, installation)"
        run: node scripts/test-pentest.mjs
      - name: Containerfile Android (hadolint, erreurs seulement)
        run: docker run --rm -i docker.io/hadolint/hadolint hadolint --failure-threshold error - < addons/android/libexec/oc-android/Containerfile
      - name: Installation avec le module Android, mémorisation puis retrait
        run: |
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/android" OBSCURA_BIN_DIR="$RUNNER_TEMP/abin"
          ./install.sh --no-tools --android
          test -f "$OPENCODE_CONFIG_DIR/agents/android.md" && test -f "$OPENCODE_CONFIG_DIR/skills/android-dev/SKILL.md"
          ./install.sh --no-tools                      # sans option : le module est conservé
          test -f "$OPENCODE_CONFIG_DIR/agents/mobile-tester.md"
          test "$(grep -c '>>> android' "$OPENCODE_CONFIG_DIR/agents/ceo.md")" -eq 1
          ./install.sh --no-tools --no-android
          test ! -e "$OPENCODE_CONFIG_DIR/agents/android.md"
      - name: Installation à blanc (complète puis légère, sans outils)
        run: |
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/full" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --no-tools
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/lite" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --lite
          test "$(ls "$RUNNER_TEMP/lite/agents" | wc -l)" -eq 12

  shellcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh doctor.sh scripts/*.sh config/bin/* addons/android/bin/* addons/android/libexec/oc-android/*.sh addons/android/libexec/oc-android/adb-shim

  rust-template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Générer et vérifier le gabarit Rust
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          ./scripts/new-rust-project.sh demo-ci "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/demo-ci"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  # Distributions : Arch (base d'Omarchy), Debian, Fedora, RHEL (Rocky)
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux (Omarchy)
            image: archlinux:latest
            setup: pacman -Syu --noconfirm nodejs npm git python tar gzip curl
          - name: Debian 12
            image: debian:12
            setup: apt-get update && apt-get install -y nodejs npm git python3 curl ca-certificates tar gzip
          - name: Debian 13
            image: debian:13
            setup: apt-get update && apt-get install -y nodejs npm git python3 curl ca-certificates tar gzip
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y nodejs npm git python3 tar gzip curl
          - name: RHEL (Rocky 9)
            image: rockylinux:9
            setup: dnf module enable -y nodejs:20 && dnf install -y nodejs npm git python3 tar gzip
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: Dépendances système
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Validation du kit
        run: node --version && node scripts/validate-kit.mjs
      - name: Installation à blanc (complète puis légère)
        run: |
          export OPENCODE_CONFIG_DIR=/tmp/oc-full OBSCURA_BIN_DIR=/tmp/oc-bin
          ./install.sh --no-tools 2>&1 | tee /tmp/install.log
          grep -q "Système :" /tmp/install.log
          OPENCODE_CONFIG_DIR=/tmp/oc-lite ./install.sh --lite
          test "$(ls /tmp/oc-lite/agents | wc -l)" -eq 12
      - name: oc-rea-mcp (versions de Node acceptées par REA)
        run: |
          check() { OC_REA_NODE_VERSION="$1" ./config/bin/oc-rea-mcp --check >/dev/null 2>&1; }
          for v in 26.12.1 26.13.0 27.0.0 24.22.1 24.30.0 22.23.4; do check "$v" || { echo "attendu OK : $v"; exit 1; }; done
          for v in 26.7.0 26.12.0 25.9.0 24.22.0 22.23.3 20.19.0 18.0.0; do check "$v" && { echo "attendu KO : $v"; exit 1; } || true; done
      - name: Installateur côté machine (awk et sed de la distribution)
        run: node scripts/test-install-env.mjs
      - name: Module Android (tests avec faux podman, sans Docker)
        run: node scripts/test-android.mjs
      - name: Outils pentest/appsec (option --pentest)
        run: node scripts/test-pentest.mjs
      - name: Lanceurs MCP (choix du navigateur et du moteur de conteneurs)
        run: |
          mkdir -p /tmp/fake && cd /tmp/fake
          printf '#!/bin/sh\necho "[npx] $*"\n' > npx && chmod +x npx
          printf '#!/bin/sh\n[ "$1" = info ] && exit 0\necho "[podman] $*"\n' > podman && chmod +x podman
          printf '#!/bin/sh\n' > chromium && chmod +x chromium
          PATH=/tmp/fake:$PATH /tmp/oc-bin/oc-playwright-mcp | grep -- "--executable-path /tmp/fake/chromium"
          PATH=/tmp/fake:/usr/bin:/bin /tmp/oc-bin/oc-terraform-mcp | grep -E "\[(podman|docker)\] run"

