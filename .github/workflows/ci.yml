name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Validate the kit (config, agents, skills, plugins, secrets)
        run: node scripts/validate-kit.mjs
      - name: "MCP state (idempotent JSONC, comments preserved, exit codes 1/2)"
        run: node scripts/test-mcp-state.mjs
      - name: "Lite profile (12 agents, MCP, plugins, skills, commands, CEO prose)"
        run: node scripts/test-lite.mjs
      - name: "Offline diagnostic (exit codes 0/1, no network requests)"
        run: node scripts/test-doctor.mjs
      - name: "oc-deps (pinned version drift: local fixtures, isolated cache, no network)"
        run: node scripts/test-deps.mjs
      - name: Local plugins (functional test with a fake OpenCode v2 context)
        run: node scripts/test-plugins.mjs
      - name: oc-models (per-agent model selection, survives updates)
        run: node scripts/test-models.mjs
      - name: oc-versions (latest real versions, cache and fixtures without network)
        run: node scripts/test-versions.mjs
      - name: "Supply chain (pinned versions, checksums, rejection of tampered assets)"
        run: node scripts/test-supply-chain.mjs
      - name: Config conforms to the official OpenCode JSON schema (full + lite)
        run: |
          # The distro jsonschema may be too old (Debian 12: 4.10.3, Rocky 9: 3.2.0):
          # dedicated venv with >= 4.18, which follows the schema's remote reference (UA accepted).
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet 'jsonschema>=4.18'
          /tmp/schema-venv/bin/python scripts/validate-schema.py
      - name: "Machine-side installer: environment block, uninstall, MemPalace, stale OpenCode diagnostic"
        run: node scripts/test-install-env.mjs
      - name: "Android module (fake podman: commands, mounts, safeguards, fake adb)"
        run: node scripts/test-android.mjs
      - name: "Pentest/appsec tools (--pentest option: GitHub discovery, sha256, installation)"
        run: node scripts/test-pentest.mjs
      - name: "agent-wt (real worktrees under /tmp: task, list --porcelain, registry, conflicts)"
        run: node scripts/test-agent-wt.mjs
      - name: "Android project generator (hermetic: template, substitutions, git, overwrite refusal)"
        run: node scripts/test-new-android.mjs
      - name: Android Containerfile (hadolint, errors only)
        run: docker run --rm -i docker.io/hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < addons/android/libexec/oc-android/Containerfile
      - name: Installation with the Android module, remembered then removed
        run: |
          export OPENCODE_CONFIG_DIR="$RUNNER_TEMP/android" OBSCURA_BIN_DIR="$RUNNER_TEMP/abin"
          ./install.sh --no-tools --android
          test -f "$OPENCODE_CONFIG_DIR/agents/android.md" && test -f "$OPENCODE_CONFIG_DIR/skills/android-dev/SKILL.md"
          ./install.sh --no-tools                      # no option: the module is kept
          test -f "$OPENCODE_CONFIG_DIR/agents/mobile-tester.md"
          test "$(grep -c '>>> android' "$OPENCODE_CONFIG_DIR/agents/ceo.md")" -eq 1
          ./install.sh --no-tools --no-android
          test ! -e "$OPENCODE_CONFIG_DIR/agents/android.md"
      - name: Dry-run installation (full then lite, without tools)
        run: |
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/full" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --no-tools
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/lite" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --lite
          test "$(find "$RUNNER_TEMP/lite/agents" -maxdepth 1 -type f | wc -l)" -eq 12

  shellcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh doctor.sh scripts/*.sh config/bin/* addons/android/bin/* addons/android/libexec/oc-android/*.sh addons/android/libexec/oc-android/adb-shim

  rust-template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate and check the Rust template
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          ./scripts/new-rust-project.sh demo-ci "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/demo-ci"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  # Distributions: Arch (Omarchy base), Debian, Ubuntu, Fedora, RHEL (Rocky)
  # Images pinned by dated tag, never latest (tags checked on 2026-11-03).
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux (Omarchy)
            image: archlinux:base-20261101.0.620205
            python: python            # Arch does not provide python3, only python
            setup: pacman -Syu --noconfirm nodejs npm git python tar gzip curl
          - name: Debian 12 (bookworm)
            image: debian:12.12
            python: python3
            setup: apt-get update && apt-get install -y nodejs npm git python3 python3-venv python3-pip curl ca-certificates tar gzip
          - name: Debian 13 (trixie)
            image: debian:13.1
            python: python3
            setup: apt-get update && apt-get install -y nodejs npm git python3 python3-venv python3-pip curl ca-certificates tar gzip
          - name: Ubuntu 24.04
            image: ubuntu:24.04
            python: python3
            setup: apt-get update && apt-get install -y nodejs npm git python3 python3-venv python3-pip curl ca-certificates tar gzip
          - name: Ubuntu 26.04
            image: ubuntu:26.04
            python: python3
            setup: apt-get update && apt-get install -y nodejs npm git python3 python3-venv python3-pip curl ca-certificates tar gzip
          - name: Fedora 44
            image: fedora:44
            python: python3
            setup: dnf install -y nodejs npm git python3 python3-pip tar gzip curl
          - name: RHEL (Rocky 9)
            image: quay.io/rockylinux/rockylinux:9.8
            python: python3
            # The image provides curl-minimal: requesting curl breaks the dnf transaction.
            setup: dnf module enable -y nodejs:20 && dnf install -y --setopt=install_weak_deps=False nodejs npm git python3 tar gzip python3-pip
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: System dependencies
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Installation script syntax
        run: bash -n install.sh uninstall.sh
      - name: Kit validation
        run: node --version && node scripts/validate-kit.mjs
      - name: Local plugins (fake OpenCode v2 context)
        run: node scripts/test-plugins.mjs
      - name: "MCP state (idempotent JSONC, comments preserved, exit codes 1/2)"
        run: node scripts/test-mcp-state.mjs
      - name: "Lite profile (12 agents, MCP, plugins, skills, commands, CEO prose)"
        run: node scripts/test-lite.mjs
      - name: "Offline diagnostic (exit codes 0/1, no network requests)"
        run: node scripts/test-doctor.mjs
      - name: "oc-deps (pinned version drift: local fixtures, no network)"
        run: node scripts/test-deps.mjs
      - name: oc-models (per-agent model selection, survives updates)
        run: node scripts/test-models.mjs
      - name: Config conforms to the official OpenCode JSON schema (venv, jsonschema >= 4.18)
        run: |
          # The distro jsonschema is too old (Debian 12: 4.10.3, Rocky 9: 3.2.0) and does
          # not resolve the schema's remote reference (403 on UA): dedicated venv.
          ${{ matrix.python }} -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet 'jsonschema>=4.18'
          /tmp/schema-venv/bin/python scripts/validate-schema.py
      - name: Installation with the Android module (no tools) and file presence
        run: |
          export OPENCODE_CONFIG_DIR=/tmp/oc-android OBSCURA_BIN_DIR=/tmp/oc-bin
          ./install.sh --no-tools --android
          test -f "$OPENCODE_CONFIG_DIR/agents/android.md"
          test -f "$OPENCODE_CONFIG_DIR/agents/mobile-tester.md"
          test -f "$OPENCODE_CONFIG_DIR/skills/android-dev/SKILL.md"
      - name: Dry-run installation (full then lite)
        shell: bash
        run: |
          set -o pipefail
          export OPENCODE_CONFIG_DIR=/tmp/oc-full OBSCURA_BIN_DIR=/tmp/oc-bin
          ./install.sh --no-tools 2>&1 | tee /tmp/install.log
          grep -q "System:" /tmp/install.log
          OPENCODE_CONFIG_DIR=/tmp/oc-lite ./install.sh --lite
          test "$(find /tmp/oc-lite/agents -maxdepth 1 -type f | wc -l)" -eq 12
      - name: oc-rea-mcp (Node versions accepted by REA)
        run: |
          check() { OC_REA_NODE_VERSION="$1" ./config/bin/oc-rea-mcp --check >/dev/null 2>&1; }
          for v in 26.12.1 26.13.0 27.0.0 24.22.1 24.30.0 22.23.4; do check "$v" || { echo "expected OK: $v"; exit 1; }; done
          for v in 26.7.0 26.12.0 25.9.0 24.22.0 22.23.3 20.19.0 18.0.0; do check "$v" && { echo "expected failure: $v"; exit 1; } || true; done
      - name: Machine-side installer (distribution awk and sed)
        run: node scripts/test-install-env.mjs
      - name: Android module (tests with fake podman, no Docker)
        run: node scripts/test-android.mjs
      - name: Android project generator (hermetic, no Podman)
        run: node scripts/test-new-android.mjs
      - name: Pentest/appsec tools (--pentest option)
        run: node scripts/test-pentest.mjs
      - name: MCP launchers (browser and container engine selection)
        run: |
          mkdir -p /tmp/fake && cd /tmp/fake
          printf '%s\n' '#!/bin/sh' "echo \"[npx] \$*\"" > npx && chmod +x npx
          printf '%s\n' '#!/bin/sh' "[ \"\$1\" = info ] && exit 0" "echo \"[podman] \$*\"" > podman && chmod +x podman
          printf '#!/bin/sh\n' > chromium && chmod +x chromium
          PATH=/tmp/fake:$PATH /tmp/oc-bin/oc-playwright-mcp | grep -- "--executable-path /tmp/fake/chromium"
          PATH=/tmp/fake:/usr/bin:/bin /tmp/oc-bin/oc-terraform-mcp | grep -E "\[(podman|docker)\] run"

