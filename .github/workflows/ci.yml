name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Valider le kit (config, agents, skills, plugins, secrets)
        run: node scripts/validate-kit.mjs
      - name: Config conforme au schéma JSON officiel d'OpenCode (complet + léger)
        run: |
          pip install --quiet jsonschema
          python3 scripts/validate-schema.py
      - name: Installation à blanc (complète puis légère, sans outils)
        run: |
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/full" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --no-tools
          OPENCODE_CONFIG_DIR="$RUNNER_TEMP/lite" OBSCURA_BIN_DIR="$RUNNER_TEMP/bin" ./install.sh --lite
          test "$(ls "$RUNNER_TEMP/lite/agents" | wc -l)" -eq 12

  shellcheck:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh doctor.sh scripts/*.sh config/bin/*

  rust-template:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Générer et vérifier le gabarit Rust
        run: |
          git config --global user.name ci && git config --global user.email ci@example.com
          ./scripts/new-rust-project.sh demo-ci "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/demo-ci"
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo test --all-targets

  # Distributions : Arch (base d'Omarchy), Debian, Fedora, RHEL (Rocky)
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux (Omarchy)
            image: archlinux:latest
            setup: pacman -Syu --noconfirm nodejs npm git python tar gzip curl
          - name: Debian 12
            image: debian:12
            setup: apt-get update && apt-get install -y nodejs npm git python3 curl ca-certificates tar gzip
          - name: Debian 13
            image: debian:13
            setup: apt-get update && apt-get install -y nodejs npm git python3 curl ca-certificates tar gzip
          - name: Fedora
            image: fedora:latest
            setup: dnf install -y nodejs npm git python3 tar gzip curl
          - name: RHEL (Rocky 9)
            image: rockylinux:9
            setup: dnf module enable -y nodejs:20 && dnf install -y nodejs npm git python3 tar gzip
    name: ${{ matrix.name }}
    container: ${{ matrix.image }}
    steps:
      - name: Dépendances système
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v7
      - name: Validation du kit
        run: node --version && node scripts/validate-kit.mjs
      - name: Installation à blanc (complète puis légère)
        run: |
          export OPENCODE_CONFIG_DIR=/tmp/oc-full OBSCURA_BIN_DIR=/tmp/oc-bin
          ./install.sh --no-tools 2>&1 | tee /tmp/install.log
          grep -q "Système :" /tmp/install.log
          OPENCODE_CONFIG_DIR=/tmp/oc-lite ./install.sh --lite
          test "$(ls /tmp/oc-lite/agents | wc -l)" -eq 12
      - name: Lanceurs MCP (choix du navigateur et du moteur de conteneurs)
        run: |
          mkdir -p /tmp/fake && cd /tmp/fake
          printf '#!/bin/sh\necho "[npx] $*"\n' > npx && chmod +x npx
          printf '#!/bin/sh\n[ "$1" = info ] && exit 0\necho "[podman] $*"\n' > podman && chmod +x podman
          printf '#!/bin/sh\n' > chromium && chmod +x chromium
          PATH=/tmp/fake:$PATH /tmp/oc-bin/oc-playwright-mcp | grep -- "--executable-path /tmp/fake/chromium"
          PATH=/tmp/fake:/usr/bin:/bin /tmp/oc-bin/oc-terraform-mcp | grep -E "\[(podman|docker)\] run"

